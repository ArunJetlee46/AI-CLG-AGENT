# Fly.io config (free tier: ~3 free machines/month).
# Deploy:  fly launch --copy-config --no-deploy && fly deploy
# Secrets: fly secrets set SECRET_KEY=... DEFAULT_ADMIN_PASSWORD=... GROQ_API_KEY=...

app = "beru-backend"
primary_region = "ams"

[build]
  dockerfile = "backend/Dockerfile"
  docker_build_context = "."

[env]
  APP_ENV = "production"
  DEBUG = "false"
  # Uses the attached Postgres volume service below (created via fly postgres create)
  DATABASE_URL = "postgresql+psycopg2://beru:beru@beru-db.internal:5432/beru"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "beru_data"
  destination = "/data"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "celery -A app.workers.celery_app worker -l info"
