name: CD

# Continuous delivery: on a successful CI run on main, build both images and
# push them to GHCR. Provider-specific deploys (Render/Fly/Vercel/Netlify) are
# triggered from the pushed tags by the respective platform's webhooks —
# set the required secrets in the repository settings:
#   CD_GITHUB_TOKEN  (GHCR publish — usually automatic via GITHUB_TOKEN)
#
# Render:  connect the repo, render.yaml blueprint (web + worker + postgres)
# Fly:     fly deploy --remote-only  (requires FLY_API_TOKEN)
# Vercel:  vercel --prod            (requires VERCEL_TOKEN + VERCEL_ORG_ID)
# Netlify: netlify deploy --prod     (requires NETLIFY_AUTH_TOKEN + NETLIFY_SITE_ID)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/beru

jobs:
  images:
    name: Build + push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-backend:latest
            ${{ env.IMAGE_BASE }}-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-frontend:latest
            ${{ env.IMAGE_BASE }}-frontend:${{ github.sha }}

      - name: Dispatch deploy webhook (Render/Fly)
        if: always()
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then curl -fsS -X POST "$RENDER_DEPLOY_HOOK"; fi
          if [ -n "$FLY_API_TOKEN" ] && command -v flyctl >/dev/null; then flyctl deploy --remote-only; fi
